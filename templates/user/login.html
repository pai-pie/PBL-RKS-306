<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - GuardianTix</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/user/login.css') }}">
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash-message {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Form Login -->
    <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
      <label for="email">Email</label>
      <input 
        type="text" 
        name="email" 
        id="email" 
        placeholder="email" 
        required 
        autocomplete="off"
        value="{{ request.form.email if request.form }}">

      <label for="password">Password</label>
      <input 
        type="password" 
        name="password" 
        id="password" 
        placeholder="Enter your password (min 12 characters)" 
        required 
        autocomplete="current-password"
        minlength="12">

      <button type="submit">Sign In</button>
    </form>

    <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    
    <!-- Admin Login Hint -->

  <script>
    // Real-time password validation
    document.getElementById('password').addEventListener('input', function(e) {
      const password = e.target.value;
      
      if (password.length < 12) {
        e.target.setCustomValidity('Minimum 12 characters required');
        e.target.style.borderColor = '#C73E3E';
      } else {
        e.target.setCustomValidity('');
        e.target.style.borderColor = '#FFD700';
      }
    });

    // Form submission validation
    document.querySelector('form').addEventListener('submit', function(e) {
      const password = document.getElementById('password').value;
      
      if (password.length < 12) {
        e.preventDefault();
        alert('Password must be at least 12 characters long!');
        return;
      }
    });
  </script>
</body>
</html>
